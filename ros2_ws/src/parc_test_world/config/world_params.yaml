# Parameters for the test arena.
#
# This file is the single source of truth for the generated world. After editing
# it, regenerate the world and models, then rebuild:
#
#   python3 parc_test_world/scripts/generate_world.py
#   colcon build --packages-select parc_test_world
#
# All units are metres / radians. The arena is centred on the world origin, so
# its inner edges are at x = +/- arena.size_x / 2 and y = +/- arena.size_y / 2.
# Dimensions marked "eyeballed" are estimates of the real environment - measure
# and update them when you can.

arena:
  size_x: 6.0               # inner width of the rectangular arena
  size_y: 7.0               # inner height of the rectangular arena
  barrier_height: 0.30      # eyeballed: low border around the arena
  barrier_thickness: 0.05

apriltag:
  family: tag36h11
  tag_size: 0.165           # edge length of the BLACK square (what apriltag_ros calls "size")
  margin_cells: 2           # white quiet zone around the black square, in tag cells.
  # With only 1 cell, detectors (OpenCV aruco) often miss the tag against a grey
  # background. The full printed square is tag_size * (8 + 2*margin_cells) / 8
  # = 0.248 m for the values above.

pole:
  diameter: 0.06            # eyeballed
  height: 1.50              # eyeballed
  base_diameter: 0.35       # eyeballed: weighted round base the pole stands on
  base_height: 0.03
  tag_center_height: 1.00   # eyeballed: height of the tag centre above the floor
  plate_thickness: 0.005    # backing plate the tag is stuck to

# One tag per pole. IDs match the PARC 2026 referee (1, 4, 7, 9). The tag faces the arena centre unless "yaw" is given
# (yaw = direction the tag faces, measured from +x).
poles:
  - {id: 1, x:  2.5, y:  3.0}
  - {id: 4, x: -2.5, y:  3.0}
  - {id: 7, x: -2.5, y: -3.0}
  - {id: 9, x:  2.5, y: -3.0}

# Tables use the cafe_table model (0.91 m square top, 0.78 m tall).
tables:
  - {name: table_a, x: -1.0, y:  0.9, yaw: 0.0}
  - {name: table_b, x:  1.0, y: -0.9, yaw: 0.0}

# Chairs use the WoodenChair model. If "face" is set to a table name, the chair is
# turned to face that table and "yaw" is ignored.
# Chairs are tucked in 0.50 m from the table centre: the seat front sits ~13 cm
# under the tabletop, the backrest (0.79 m tall) stays outside the table edge.
chairs:
  - {name: chair_a1, x: -1.50, y:  0.90, face: table_a}
  - {name: chair_a2, x: -1.00, y:  1.40, face: table_a}
  - {name: chair_a3, x: -0.50, y:  0.90, face: table_a}
  - {name: chair_b1, x:  1.50, y: -0.90, face: table_b}
  - {name: chair_b2, x:  1.00, y: -1.40, face: table_b}
  - {name: chair_b3, x:  0.50, y: -0.90, face: table_b}

# Default robot spawn pose (can be overridden with launch arguments).
spawn:
  x: -1.8
  y: 0.0
  z: 0.05
  yaw: 0.0
